name: EAS Update (Mobile OTA)

# Manual only. This used to run on every push to main and failed each time
# (the "Push EAS Update" step exits 1 — most likely a missing/invalid
# EXPO_TOKEN secret, or no EAS build/runtime to update), which spammed failure
# emails. Run it from the Actions tab ("Run workflow") when you actually want to
# push an OTA JS update. To re-enable auto-updates: confirm `eas update` works
# locally, set the EXPO_TOKEN repo secret, then restore the `push:` trigger
# below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'packages/web/**'
  #     - '.github/workflows/deploy-web.yml'

jobs:
  eas-update:
    name: Push OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push EAS Update
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          eas update --branch "$BRANCH_NAME" --message "Auto-update from $BRANCH_NAME ($(git log -1 --pretty=%s))"
